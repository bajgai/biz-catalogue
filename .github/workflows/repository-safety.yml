name: Repository safety

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-repository-guard:
    name: Public repository guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install pinned guardrails
        run: |
          pip install "git+https://github.com/bajgai/guardrails@v0.1.1"
          python -m guardrails --version
      - name: Test publication boundaries
        run: python3 -m unittest discover -s tests
      - name: Inspect all history reachable from this commit
        run: |
          python3 scripts/public_repo_guard.py --history HEAD
          python3 -m guardrails check --history HEAD

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan credentials with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          if ! "$RUNNER_TEMP/gitleaks" git . --redact=100 \
            --log-opts='--all --full-history -m' --config .gitleaks.toml \
            --ignore-gitleaks-allow --no-banner --log-level=error \
            > "$RUNNER_TEMP/gitleaks-private.log" 2>&1; then
            echo '::error::Secret scan failed. Reproduce locally in private; findings are not published.'
            exit 1
          fi
